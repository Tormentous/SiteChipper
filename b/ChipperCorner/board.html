<!DOCTYPE html>
<html data-cb-context="chipper" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/img/favicon3.ico" type="image/x-icon">
  <title>Board - Coolbrador</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="board-page">
  <div id="shared-header"></div>
<script src="/js/shell-boot.js"></script>
  <div class="test-watermark" id="testWatermark" hidden>test</div>

  <div class="board-banner">
    <div class="banner-bg">
      <img src="" alt="" class="banner-image" id="bannerImg" onerror="this.style.display='none'">
    </div>
    <div class="banner-content">
      <h1 id="boardName"></h1>
    </div>
    <img id="boardIcon" src="" alt="icon" onerror="this.src='/users/default/pfp.jpg'">
  </div>

  <section class="container bodytext-section board-main">
    <div class="board-meta-row">
      <p class="board-desc" id="boardDesc"></p>
      <button type="button" class="board-edit-btn" id="editBoardBtn">Edit board</button>
    </div>

    <div class="create-post-container" id="createPostBox">
      <div class="create-post">
        <div class="post-avatar">
          <img id="currentUserPfp" src="/users/default/pfp.jpg" alt="You">
        </div>
        <textarea id="newPostText" placeholder="Post to this board..."></textarea>
      </div>
      <div class="media-preview" id="mediaPreview" style="display:none;"></div>
      <div class="create-post-footer">
        <div class="post-tools">
          <button type="button" class="tool-btn" id="attachMedia" title="Add photo/video">Photo/Video</button>
        </div>
        <button type="button" class="post-submit-btn" id="submitPost" disabled>Post</button>
      </div>
    </div>
    <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;">

    
    <div class="cb-board-tabs" role="tablist" aria-label="Board sections">
      <button type="button" class="cb-board-tab is-active" data-board-tab="posts" role="tab" aria-selected="true">Posts</button>
      <button type="button" class="cb-board-tab" data-board-tab="debates" role="tab" aria-selected="false">Debates</button>
      <button type="button" class="cb-board-tab" data-board-tab="mods" role="tab" aria-selected="false">Moderators</button>
    </div>
    <div class="cb-board-tab-panels">
      <div class="cb-board-panel is-active" data-board-panel="posts">
        <div class="gallery items" id="postsContainer"></div>
      </div>
      <div class="cb-board-panel" data-board-panel="debates" hidden>
        <div class="cb-board-debate-list" id="boardDebates"></div>
      </div>
      <div class="cb-board-panel" data-board-panel="mods" hidden>
        <div id="boardMods"></div>
      </div>
    </div>

  </section>

  <div id="boardEditModal" class="cb-modal" hidden>
    <div class="cb-modal-card">
      <h2>Edit board</h2>
      <label>Display name<input type="text" id="boardEditName" maxlength="48"></label>
      <label>Description<textarea id="boardEditDesc" rows="3" maxlength="280"></textarea></label>
      <div class="cb-modal-actions">
        <button type="button" class="secondary" id="boardEditCancel">Cancel</button>
        <button type="button" id="boardEditSave">Save</button>
      </div>
    </div>
  </div>

  <div id="shared-footer"></div>
  <script src="/js/layout.js"></script>
  <script src="/js/seed-demo.js"></script>
  <script src="/js/media-viewer.js"></script>
  <script src="/js/cb-scrub-chart.js"></script>
<script src="/js/cb-media-player.js"></script>
<script src="/js/cb-feed-algo.js"></script>
<script src="/js/cb-sensitive-filter.js"></script>
  <script src="/js/cb-media-safety.js"></script>
  <script src="/js/posts.js"></script>
<script src="/js/board-tabs.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const CP = window.CoolbradorPosts;
  if (!CP) return;

  const parts = location.pathname.split("/").filter(Boolean);
  const rawId = parts[1] || "General";
  const boardId = { beesid: "BeeSid", general: "General", testboard: "testboard" }[String(rawId).toLowerCase()] || rawId;
  const metaKey = "boardmeta_/b/" + boardId;
  const key = "posts_/b/" + boardId;
  ["posts_/b/" + rawId, "boardmeta_/b/" + rawId].forEach(function (alt, i) {
    const dest = i === 0 ? key : metaKey;
    if (alt === dest) return;
    if (!localStorage.getItem(dest) && localStorage.getItem(alt)) {
      localStorage.setItem(dest, localStorage.getItem(alt));
    }
  });
  let meta = {};
  try { meta = JSON.parse(localStorage.getItem(metaKey) || "{}"); } catch (_) { meta = {}; }
  if (!meta.name) meta.name = boardId;
  if (!meta.desc) meta.desc = "A Coolbrador board. Edit me anytime.";

  document.title = boardId + " - Coolbrador Boards";
  document.getElementById("boardName").textContent = meta.name;
  document.getElementById("boardDesc").textContent = meta.desc;
  const iconEl = document.getElementById("boardIcon");
  const knownBoard = { beesid: "BeeSid", general: "General", testboard: "testboard" }[String(boardId).toLowerCase()] || boardId;
  iconEl.src = "/b/" + knownBoard + "/icon.png";
  iconEl.onerror = function () {
    this.onerror = null;
    this.src = knownBoard.toLowerCase() === "beesid"
      ? "/shared/TestImages/ProfilePhotos/BeeSid.png"
      : "/users/default/pfp.jpg";
  };
  document.getElementById("bannerImg").src = "/b/" + knownBoard + "/banner.jpg";

  if (boardId === "General" || boardId === "testboard" || meta.test) {
    document.getElementById("testWatermark").hidden = false;
  }

  let posts = [];
  try { posts = JSON.parse(localStorage.getItem(key) || "[]"); } catch (_) { posts = []; }
  posts.forEach(p => { p.yeahs = p.yeahs || []; p.replies = p.replies || []; p.views = p.views || 0; });

  const container = document.getElementById("postsContainer");

  function savePosts() { localStorage.setItem(key, JSON.stringify(posts)); }

  function render() {
    posts = [];
    try { posts = JSON.parse(localStorage.getItem(key) || "[]"); } catch (_) { posts = []; }
    posts.forEach(p => { p.yeahs = p.yeahs || []; p.replies = p.replies || []; p.views = p.views || 0; });
    if (!posts.length) {
      container.innerHTML = '<p class="empty-feed">No posts yet. Be the first!</p>';
      return;
    }
    const uid = CP.sessionUserId();
    const sorted = posts.slice().sort((a, b) => b.id - a.id);
    container.innerHTML = sorted.map(post => {
      const canEdit = CP.isSignedIn() && String(post.userId) === String(uid);
      return CP.renderPostCard(post, {
        board: "/b/" + boardId,
        showBoard: false,
        hideBoard: true,
        canEdit: canEdit
      });
    }).join("");
  }

  CP.bindFeedInteractions(container, {
    reload: render,
    onYeah: function () {},
    navigateToBoard: false,
    onClick: function (e) {
      const delBtn = e.target.closest(".post-del-btn");
      if (delBtn) {
        if (!confirm("Delete this post?")) return true;
        posts = posts.filter(p => p.id !== Number(delBtn.dataset.id));
        savePosts();
        render();
        return true;
      }
      const editBtn = e.target.closest(".post-edit-btn");
      if (editBtn) {
        const post = posts.find(p => p.id === Number(editBtn.dataset.id));
        if (!post) return true;
        const next = prompt("Edit post text:", post.text || "");
        if (next === null) return true;
        post.text = next.trim();
        post.edited = new Date().toISOString();
        savePosts();
        render();
        return true;
      }
    }
  });

  CP.mountComposer(document.getElementById("createPostBox"), {
    defaultBoard: boardId,
    getBoardName: function () { return boardId; },
    onPosted: function () { render(); }
  });

  const modal = document.getElementById("boardEditModal");
  document.getElementById("editBoardBtn").onclick = () => {
    document.getElementById("boardEditName").value = meta.name || boardId;
    document.getElementById("boardEditDesc").value = meta.desc || "";
    modal.hidden = false;
  };
  document.getElementById("boardEditCancel").onclick = () => { modal.hidden = true; };
  document.getElementById("boardEditSave").onclick = () => {
    meta.name = document.getElementById("boardEditName").value.trim() || boardId;
    meta.desc = document.getElementById("boardEditDesc").value.trim();
    localStorage.setItem(metaKey, JSON.stringify(meta));
    document.getElementById("boardName").textContent = meta.name;
    document.getElementById("boardDesc").textContent = meta.desc;
    modal.hidden = true;
  };

  render();
});
</script>
</body>
</html>
