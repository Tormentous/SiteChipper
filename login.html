<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/img/favicon3.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stupid Login Page</title>
  <link rel="stylesheet" href="styles-login.css">
  <script>
    (function () {
      try {
        var known = ["default","green","ember","violet","ocean","rose","slate"];
        var t = localStorage.getItem("cb_theme") || "default";
        if (t === "certa-green") {
          t = "green";
          try { localStorage.setItem("cb_theme", "green"); } catch (e) {}
        }
        if (t === "light") {
          t = "default";
          try {
            localStorage.setItem("cb_theme", "default");
            if (!localStorage.getItem("cb_mode")) localStorage.setItem("cb_mode", "light");
          } catch (e) {}
        }
        if (known.indexOf(t) === -1) t = "default";
        var mode = localStorage.getItem("cb_mode") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.mode = mode;
        if (t !== "default") document.documentElement.classList.add("pre-theme-" + t);
        var wall = localStorage.getItem("cb_wallpaper");
        if (wall) {
          document.documentElement.classList.add("cb-has-wallpaper");
          document.documentElement.style.setProperty("--cb-wallpaper", 'url("' + wall.replace(/\/g, "\\").replace(/"/g, '\"') + '")');
          document.documentElement.style.setProperty("--cb-wallpaper-tint", (localStorage.getItem("cb_wallpaper_tint") || "55") + "%");
          document.documentElement.style.setProperty("--cb-wallpaper-blur", (localStorage.getItem("cb_wallpaper_blur") || "0") + "px");
        }
        var accent = localStorage.getItem("cb_custom_accent");
        if (accent) {
          document.documentElement.style.setProperty("--cb-accent", accent);
          document.documentElement.style.setProperty("--cb-link", accent);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="logo">Coolbrador</div>
    <p class="subtitle">Bark up the right tree!</p>

    <!-- Login Form (Firebase email auth) -->
    <div id="loginForm" class="form active">
      <label class="field-label" for="loginUsername">Email</label>
      <input type="email" id="loginUsername" placeholder="Email" autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password">
      <div class="extra">
        <label><input type="checkbox"> Remember me</label>
        <span style="cursor:pointer;color:var(--cb-accent);">Forgot password?</span>
      </div>
      <button id="loginButton">Log In</button>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" class="form">
      <input type="text" id="signupUsername" placeholder="Username">
      <input type="email" id="signupEmail" placeholder="Email">
      <input type="password" id="signupPassword" placeholder="Password">
      <button id="signupButton">Create Account</button>
    </div>

    <!-- Toggle link -->
    <div class="toggle">
      <span id="toggleText">Don't have an account? Sign up</span>
    </div>

    <p id="result"></p>
    <p class="legal">(c) 2026 Coolbrador LLC - All rights reserved</p>

    <!-- reCAPTCHA container (still needed for SMS MFA) -->
    <div id="recaptcha-container"></div>
  </div>

  <!-- ---------------------------------------------- -->
  <!-- MAIN SCRIPT - Google parts removed             -->
  <!-- ---------------------------------------------- -->
  <script type="module">
    import { auth } from './js/firebase.js';
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      RecaptchaVerifier,
      multiFactor,
      PhoneAuthProvider,
      PhoneMultiFactorGenerator,
      getMultiFactorResolver
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      query,
      where,
      getDocs,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    console.log("login.html - Firebase module loaded");
    console.log("login.html - Initial auth.currentUser:", auth.currentUser);

    const db = getFirestore();
    let recaptchaVerifier = null;
    let isLogin = true;

    // --- Helper ---------------------------------------
    function rememberLocalSession(profileId, user, username) {
      if (profileId == null || profileId === "") return;
      const id = String(profileId);
      localStorage.setItem("loggedIn", "true");
      localStorage.setItem("currentUserId", id);
      localStorage.setItem("firebaseUid", user && user.uid ? user.uid : "");
      const existing = JSON.parse(localStorage.getItem("user_" + id) || "{}");
      existing.username = username || existing.username || (user && (user.displayName || (user.email && user.email.split("@")[0]))) || "User";
      existing.displayName = existing.username;
      existing.email = (user && user.email) || existing.email || "";
      existing.uid = (user && user.uid) || existing.uid || "";
      existing.profilePicture = existing.profilePicture || (user && user.photoURL) || "/users/default/pfp.jpg";
      existing.joined = existing.joined || Date.now();
      localStorage.setItem("user_" + id, JSON.stringify(existing));
      localStorage.setItem("pfp_" + id, existing.profilePicture);
      const profile = JSON.parse(localStorage.getItem("profile_" + id) || "{}");
      profile.id = id;
      profile.displayName = existing.username;
      profile.handle = String(existing.username || "user").toLowerCase().replace(/\s+/g, "");
      profile.bio = profile.bio || existing.bio || "";
      profile.about = profile.about || existing.about || "Member of the Coolbrador cosmos.";
      profile.avatar = existing.profilePicture;
      profile.joined = existing.joined;
      if (!Array.isArray(profile.sections)) profile.sections = profile.sections || [];
      localStorage.setItem("profile_" + id, JSON.stringify(profile));
    }


    function showMessage(text, color = "#aaa") {
      const result = document.getElementById('result');
      result.innerHTML = text;
      result.style.color = color;
    }

    // --- Setup reCAPTCHA ------------------------------
    async function initRecaptcha() {
      if (recaptchaVerifier) return;
      recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
        size: 'invisible',
        callback: () => {},
        'expired-callback': () => {}
      });
      await recaptchaVerifier.render();
    }

    // --- SIGNUP ---------------------------------------
    async function signup() {
      const username = document.getElementById('signupUsername').value.trim();
      const email    = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      if (!username || !email || !password) return showMessage("Fill all fields", "#ff5555");
      if (password.length < 6) return showMessage("Password >= 6 characters", "#ff5555");

      try {
        // 1. Atomically get and increment the next ID
        const counterRef = doc(db, "counters", "users");
        const newId = await runTransaction(db, async (transaction) => {
          const counterDoc = await transaction.get(counterRef);
          let currentNextId = counterDoc.exists() ? counterDoc.data().nextId : 0;
          transaction.set(counterRef, { nextId: currentNextId + 1 }, { merge: true });
          return currentNextId;
        });
        console.log("Assigned new user ID:", newId);

        // 2. Create the Firebase Auth user
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 3. Set displayName
        await updateProfile(user, { displayName: username });

        // 4. Create profile with integer ID
        await setDoc(doc(db, "profiles", newId.toString()), {
          uid: user.uid,
          username: username,
          displayName: username,
          email: email,
          createdAt: new Date().toISOString(),
          avatarUrl: "/users/default/pfp.jpg",
          bio: "",
          accentColor: "#0099ff",
          background: { type: "color", value: "#0d001f" },
          sections: [],
          posts: []
        });
        console.log("Profile created for ID:", newId);

        rememberLocalSession(newId, user, username);
        showMessage(`Account created! Your ID: ${newId} · Welcome, ${username}!`, "#a6e3a1");

        if (confirm("Enable SMS 2FA now?")) {
          const phone = prompt("Enter phone number (e.g. +12025550123)");
          if (phone) await enrollMFA(phone);
        }

        setTimeout(() => window.location.href = '/index.html', 1800);
      } catch (err) {
        console.error("Signup error:", err);
        let msg = "Error creating account";
        if (err.code === 'auth/email-already-in-use') msg = "Email already in use";
        if (err.code === 'auth/invalid-email') msg = "Invalid email";
        if (err.code === 'auth/weak-password') msg = "Password too weak";
        if (err.code === 'permission-denied') msg = "Permission denied - check Firestore rules";
        showMessage(msg + " (see console for details)", "#ff5555");
      }
    }

    async function ensureProfileExists() {
      const user = auth.currentUser;
      if (!user) return;

      try {
        const q = query(collection(db, "profiles"), where("uid", "==", user.uid));
        const snap = await getDocs(q);

        if (snap.empty) {
          console.log("No profile found - creating one now");
          const counterRef = doc(db, "counters", "users");
          const newId = await runTransaction(db, async (transaction) => {
            const counterDoc = await transaction.get(counterRef);
            let currentNextId = counterDoc.exists() ? counterDoc.data().nextId : 0;
            transaction.set(counterRef, { nextId: currentNextId + 1 }, { merge: true });
            return currentNextId;
          });

          await setDoc(doc(db, "profiles", newId.toString()), {
            uid: user.uid,
            username: user.displayName || user.email.split('@')[0],
            displayName: user.displayName || user.email.split('@')[0],
            email: user.email,
            createdAt: new Date().toISOString(),
            avatarUrl: user.photoURL || "/users/default/pfp.jpg",
            bio: "",
            accentColor: "#0099ff",
            background: { type: "color", value: "#0d001f" },
            sections: [],
            posts: []
          });
          console.log("Created profile with ID:", newId);
          return newId.toString();
        } else {
          const profileId = snap.docs[0].id;
          console.log("Profile already exists with ID:", profileId);
          return profileId;
        }
      } catch (err) {
        console.error("Profile ensure failed:", err);
        return null;
      }
    }

    // --- ENROLL MFA -----------------------------------
    async function enrollMFA(phoneNumber) {
      try {
        const user = auth.currentUser;
        if (!user) throw new Error("Not signed in");

        const session = await multiFactor(user).getSession();
        const phoneOpts = { phoneNumber, session };
        const verificationId = await PhoneAuthProvider.verifyPhoneNumber(phoneOpts, recaptchaVerifier);

        const code = prompt("Enter the 6-digit code sent to your phone:");
        if (!code) throw new Error("No code entered");

        const cred = PhoneAuthProvider.credential(verificationId, code.trim());
        const assertion = PhoneMultiFactorGenerator.assertion(cred);
        await multiFactor(user).enroll(assertion, "My Phone");

        showMessage("2FA enabled!", "#a6e3a1");
      } catch (err) {
        showMessage("2FA setup failed", "#ff5555");
        console.error(err);
      }
    }

    // --- LOGIN (username or email) --------------------
    async function login() {
      let input    = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!input || !password) return showMessage("Enter email + password", "#ff5555");

      let emailToUse = input;
      if (!input.includes('@')) {
        try {
          const usernameDoc = await getDoc(doc(db, "usernames", input.toLowerCase()));
          if (!usernameDoc.exists()) return showMessage("Username not found", "#ff5555");
          emailToUse = usernameDoc.data().email;
        } catch (err) {
          console.error("Username lookup failed", err);
          return showMessage("Error checking username", "#ff5555");
        }
      }

      try {
        const userCredential = await signInWithEmailAndPassword(auth, emailToUse, password);
        const user = userCredential.user;

        showMessage(`Welcome back, ${user.displayName || user.email}!`, "#a6e3a1");

        const profileId = await ensureProfileExists();
        rememberLocalSession(profileId, user, user.displayName || (user.email && user.email.split("@")[0]));

        setTimeout(() => window.location.href = '/index.html', 1200);
      } catch (err) {
        if (err.code === 'auth/multi-factor-auth-required') {
          const resolver = getMultiFactorResolver(auth, err);
          const hint = resolver.hints[0];
          const phoneOpts = { multiFactorHint: hint, session: resolver.session };
          const verificationId = await PhoneAuthProvider.verifyPhoneNumber(phoneOpts, recaptchaVerifier);

          const code = prompt("Enter 6-digit code:");
          if (!code) return showMessage("Code required", "#ff5555");

          const cred = PhoneAuthProvider.credential(verificationId, code.trim());
          const assertion = PhoneMultiFactorGenerator.assertion(cred);
          await resolver.resolveSignIn(assertion);

          console.log("[MFA] Completed - user object:", auth.currentUser);
          showMessage("Logged in with 2FA!", "#a6e3a1");
          const profileId = await ensureProfileExists();
          const u = auth.currentUser;
          rememberLocalSession(profileId, u, u && (u.displayName || (u.email && u.email.split("@")[0])));

          setTimeout(() => window.location.href = '/index.html', 1200);
        } else {
          let msg = "Could not sign in. Check your email and password.";
          if (err.code === 'auth/invalid-email') msg = "That email address looks invalid.";
          else if (err.code === 'auth/user-not-found') msg = "No account found for that email.";
          else if (err.code === 'auth/wrong-password') msg = "Wrong password.";
          else if (err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-login-credentials') {
            msg = "Wrong email or password.";
          } else if (err.code === 'auth/too-many-requests') {
            msg = "Too many attempts. Try again in a bit.";
          } else if (err.code === 'auth/user-disabled') {
            msg = "This account is disabled.";
          }
          showMessage(msg, "#ff5555");
        }
      }
    }

    // --- TOGGLE FORMS ---------------------------------
    function toggleForms() {
      isLogin = !isLogin;
      document.getElementById('loginForm').classList.toggle('active');
      document.getElementById('signupForm').classList.toggle('active');
      document.getElementById('toggleText').textContent =
        isLogin ? "Don't have an account? Sign up" : "Already have an account? Log in";
    }

    // --- INIT -----------------------------------------
    window.addEventListener('load', async () => {
      await initRecaptcha();
      console.log("DOM fully loaded - attaching listeners now");

      const toggleEl   = document.getElementById('toggleText');
      const loginBtn   = document.getElementById('loginButton');
      const signupBtn  = document.getElementById('signupButton');
      const forgotSpan = document.querySelector('.extra span');

      if (toggleEl)   toggleEl.addEventListener('click', toggleForms);
      if (loginBtn)   loginBtn.addEventListener('click', login);
      if (signupBtn)  signupBtn.addEventListener('click', signup);
      if (forgotSpan) {
        forgotSpan.addEventListener('click', () => {
          alert("Forgot password coming soon!");
        });
      }
    });

    // Enter key support
    document.addEventListener('keypress', e => {
      if (e.key === 'Enter') isLogin ? login() : signup();
    });
  </script>
</body>
</html>
